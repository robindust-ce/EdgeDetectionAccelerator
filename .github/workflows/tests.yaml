name: VUnit Tests
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy pathlib scikit-image argparse vunit_hdl

      - uses: ghdl/setup-ghdl@v1
        with:
            version: 5.1.1
            backend: mcode
            investigate: true

      - name: Verify GHDL in PATH
        run: |
          which ghdl || true
          ghdl --version || true

      - name: Run VUnit tests
        run: python scripts/run.py "*gray=True,gauss=True,sobel=True*" -v -o scripts/vunit_out

      - name: Archive run results
        uses: actions/upload-artifact@v4
        with:
            name: vunit-out
            path: scripts/vunit_out

